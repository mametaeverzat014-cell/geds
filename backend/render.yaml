# Render Blueprint — one-click deploy of the GEDS backend.
# Push this file to git, then in Render: New → Blueprint → point at the repo.
#
# Free plan caveat: instance sleeps after ~15 min idle; first wake-up takes ~30 s.
# For an ISEF demo you probably want to upgrade to Starter ($7/mo) to keep it warm.

services:
  - type: web
    name: geds-backend
    runtime: python
    region: oregon              # cheapest free region; switch to frankfurt for EU latency
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/graph/stats
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # CORS — replace with your actual Vercel project pattern after first deploy.
      - key: GEDS_CORS_ALLOW_ORIGIN_REGEX
        value: ^https://geds-.*\.vercel\.app$
      # Secrets — set in the Render dashboard (sync:false keeps them out of git).
      - key: GROK_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GNEWS_KEY
        sync: false
